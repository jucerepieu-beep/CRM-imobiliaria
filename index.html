<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviso — demonstração antiga</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #8f1010;
      color: #231010;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 760px);
      padding: clamp(28px, 7vw, 64px);
      text-align: center;
      background: #fff;
      border: 5px solid #5c0808;
      border-radius: 18px;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .attention {
      margin: 0 0 24px;
      color: #a40000;
      font-size: clamp(2.1rem, 8vw, 4.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: .04em;
    }
    h1 {
      margin: 0 auto 20px;
      max-width: 620px;
      font-size: clamp(1.45rem, 5vw, 2.5rem);
      line-height: 1.22;
    }
    .do-not-use {
      margin: 0 0 22px;
      color: #a40000;
      font-size: clamp(1.3rem, 4.5vw, 2rem);
      font-weight: 900;
      line-height: 1.2;
    }
    .next-step {
      margin: 0;
      font-size: clamp(1rem, 3.2vw, 1.35rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main role="alert" aria-labelledby="notice-title">
    <p class="attention">ATENÇÃO</p>
    <h1 id="notice-title">ESTE LINK É APENAS UMA DEMONSTRAÇÃO ANTIGA.</h1>
    <p class="do-not-use">NÃO UTILIZE ESTA VERSÃO.</p>
    <p class="next-step">Para acessar o sistema, solicite o link atualizado.</p>
  </main>
</body>
</html>
